[project]
name = "agrovision"
version = "0.1.0"
description = "Monitoreo climático, de plagas y de mercado para pequeños productores del altiplano"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # el núcleo solo usa la biblioteca estándar

[project.optional-dependencies]
panel = ["streamlit>=1.36"]
dev = ["pytest>=8"]

[project.scripts]
agrovision = "agrovision.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agrovision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
